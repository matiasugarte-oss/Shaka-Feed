name: Actualizar feed

on:
  schedule:
    - cron: "17 * * * *"   # una vez por hora, al minuto :17 (UTC); evita el :00, cuando GitHub más se atrasa
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false   # si una corrida sigue activa, la siguiente espera

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml

      - run: python -u scraper.py

      - name: Guardar feed si cambió
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.json feed.csv feed.xml feed_google.xml
          git diff --cached --quiet || git commit -m "feed: $(date -u +'%Y-%m-%d %H:%M')"
          git push
